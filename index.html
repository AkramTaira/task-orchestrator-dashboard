<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task Orchestrator Dashboard</title>
  <link rel="stylesheet" href="./styles/main.css">
</head>
<body>
  <div class="page-shell">
  <header class="app-header">
    <div class="title-block">
      <h1>Task Orchestrator Dashboard</h1>
    </div>
    <div class="actions">
      <label class="control-group">
        Workers
        <select id="workerCountSelect" aria-label="Worker count">
          <option value="1">1</option>
          <option value="2" selected>2</option>
          <option value="3">3</option>
          <option value="4">4</option>
          <option value="5">5</option>
        </select>
      </label>
      <button id="seedTasksBtn" type="button">Add Tasks</button>
      <button id="startBtn" type="button">Start</button>
      <button id="pauseBtn" type="button">Pause</button>
      <button id="resumeBtn" type="button">Resume</button>
    </div>
  </header>

  <main class="grid">
    <section class="card">
      <h2>Overview</h2>
      <div class="stats">
        <p>Total Tasks: <span id="totalCount">0</span></p>
        <p>Success Rate: <span id="successRate">0%</span></p>
        <p>Queue Depth: <span id="queueDepth">0</span></p>
        <p>Queued: <span id="queuedCount">0</span></p>
        <p>Running: <span id="runningCount">0</span></p>
        <p>Completed: <span id="completedCount">0</span></p>
        <p>Failed: <span id="failedCount">0</span></p>
        <p>Cancelled: <span id="cancelledCount">0</span></p>
      </div>
    </section>

    <section class="card">
      <h2>Workers</h2>
      <div id="workersList"></div>
    </section>

    <section class="card full">
      <h2>Active Tasks</h2>
      <div class="columns">
        <div>
          <h3>Queued</h3>
          <ul id="queuedList" class="task-list"></ul>
        </div>
        <div>
          <h3>Running</h3>
          <ul id="runningList" class="task-list"></ul>
        </div>
      </div>
    </section>

    <section class="card full">
      <h2>Task History</h2>
      <ul id="historyList" class="history-log"></ul>
    </section>

    <section class="card full">
      <h2>Audit Log</h2>
      <ul id="auditList" class="history-log"></ul>
    </section>
  </main>
  </div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
