<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task Orchestrator Dashboard</title>
  <link rel="stylesheet" href="./styles/main.css">
</head>
<body>
  <header class="app-header">
    <div class="title-block">
      <h1>Task Orchestrator Dashboard</h1>
    </div>
    <div class="actions">
      <label for="workerCountSelect">Workers</label>
      <select id="workerCountSelect" aria-label="Worker count">
        <option value="1">1</option>
        <option value="2" selected>2</option>
        <option value="3">3</option>
        <option value="4">4</option>
        <option value="5">5</option>
      </select>
      <button id="seedTasksBtn" type="button">Add Tasks</button>
      <button id="startBtn" type="button">Start</button>
      <button id="pauseBtn" type="button">Pause</button>
      <button id="resumeBtn" type="button">Resume</button>
    </div>
  </header>

  <main class="grid">
    <section class="card">
      <h2>Overview</h2>
      <div class="stats">
        <p>Total Tasks: <strong id="totalCount">0</strong></p>
        <p>Queued: <strong id="queuedCount">0</strong></p>
        <p>Running: <strong id="runningCount">0</strong></p>
        <p>Completed: <strong id="completedCount">0</strong></p>
        <p>Failed: <strong id="failedCount">0</strong></p>
        <p>Cancelled: <strong id="cancelledCount">0</strong></p>
        <p>Queue Depth: <strong id="queueDepth">0</strong></p>
        <p>Success Rate: <strong id="successRate">0%</strong></p>
        <p>State: <strong id="statusText">Idle</strong></p>
        <p>Max Concurrency: <strong id="maxConcurrency">2</strong></p>
      </div>
    </section>

    <section class="card">
      <h2>Workers</h2>
      <div id="workersList">No workers yet.</div>
    </section>

    <section class="card full">
      <h2>Queue</h2>
      <ul id="queuedList"></ul>
    </section>

    <section class="card full">
      <h2>Running</h2>
      <ul id="runningList"></ul>
    </section>

    <section class="card full">
      <h2>Task History</h2>
      <ul id="historyList" class="history-log"></ul>
    </section>
  </main>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
